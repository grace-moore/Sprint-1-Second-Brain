openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification for Second Brain - academic argument analysis tool
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: sessions
    description: Argument sessions
  - name: analysis
    description: AI analysis results
  - name: progress
    description: Progress tracking
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /sessions:
    get:
      operationId: listSessions
      tags: [sessions]
      summary: List all sessions
      responses:
        "200":
          description: List of sessions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SessionSummary"
    post:
      operationId: createSession
      tags: [sessions]
      summary: Create a new session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSessionBody"
      responses:
        "201":
          description: Created session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"

  /sessions/{id}:
    get:
      operationId: getSession
      tags: [sessions]
      summary: Get a session by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateSession
      tags: [sessions]
      summary: Update a session's content or title
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSessionBody"
      responses:
        "200":
          description: Updated session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteSession
      tags: [sessions]
      summary: Delete a session
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /sessions/{id}/analysis:
    get:
      operationId: getAnalysis
      tags: [analysis]
      summary: Get analysis results for a session
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Analysis results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Analysis"
        "404":
          description: Analysis not yet run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /sessions/{id}/analysis/items/{itemId}:
    patch:
      operationId: updateAnalysisItem
      tags: [analysis]
      summary: Accept or reject an analysis item
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: itemId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAnalysisItemBody"
      responses:
        "200":
          description: Updated analysis item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalysisItem"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /sessions/{id}/rate:
    post:
      operationId: rateSession
      tags: [sessions]
      summary: Submit a session rating
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RateSessionBody"
      responses:
        "200":
          description: Updated session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /progress:
    get:
      operationId: getProgress
      tags: [progress]
      summary: Get overall progress summary
      responses:
        "200":
          description: Progress summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProgressSummary"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    Session:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        content:
          type: string
        inputMethod:
          type: string
          enum: [paste, blank, upload]
        status:
          type: string
          enum: [draft, analyzing, complete]
        rating:
          type: ["integer", "null"]
        analysisCount:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - title
        - content
        - inputMethod
        - status
        - rating
        - analysisCount
        - createdAt
        - updatedAt

    SessionSummary:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        status:
          type: string
          enum: [draft, analyzing, complete]
        rating:
          type: ["integer", "null"]
        analysisCount:
          type: integer
        biasCount:
          type: integer
        fallacyCount:
          type: integer
        oppositionCount:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - title
        - status
        - rating
        - analysisCount
        - biasCount
        - fallacyCount
        - oppositionCount
        - createdAt
        - updatedAt

    CreateSessionBody:
      type: object
      properties:
        title:
          type: string
        inputMethod:
          type: string
          enum: [paste, blank, upload]
        content:
          type: string
      required:
        - title
        - inputMethod

    UpdateSessionBody:
      type: object
      properties:
        title:
          type: string
        content:
          type: string

    RateSessionBody:
      type: object
      properties:
        rating:
          type: integer
          minimum: 1
          maximum: 5
      required:
        - rating

    AnalysisItem:
      type: object
      properties:
        id:
          type: integer
        sessionId:
          type: integer
        type:
          type: string
          enum: [bias, fallacy, opposition]
        content:
          type: string
        explanation:
          type: string
        accepted:
          type: ["boolean", "null"]
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - sessionId
        - type
        - content
        - explanation
        - accepted
        - createdAt

    Analysis:
      type: object
      properties:
        sessionId:
          type: integer
        items:
          type: array
          items:
            $ref: "#/components/schemas/AnalysisItem"
        biasCount:
          type: integer
        fallacyCount:
          type: integer
        oppositionCount:
          type: integer
        acceptedCount:
          type: integer
      required:
        - sessionId
        - items
        - biasCount
        - fallacyCount
        - oppositionCount
        - acceptedCount

    UpdateAnalysisItemBody:
      type: object
      properties:
        accepted:
          type: boolean
      required:
        - accepted

    ProgressDataPoint:
      type: object
      properties:
        sessionId:
          type: integer
        date:
          type: string
          format: date-time
        totalItems:
          type: integer
        acceptedItems:
          type: integer
        rating:
          type: ["integer", "null"]
        title:
          type: string
      required:
        - sessionId
        - date
        - totalItems
        - acceptedItems
        - rating
        - title

    ProgressSummary:
      type: object
      properties:
        totalSessions:
          type: integer
        completedSessions:
          type: integer
        averageRating:
          type: ["number", "null"]
        totalBiasIdentified:
          type: integer
        totalFallaciesIdentified:
          type: integer
        totalOppositionGenerated:
          type: integer
        totalItemsAccepted:
          type: integer
        dataPoints:
          type: array
          items:
            $ref: "#/components/schemas/ProgressDataPoint"
      required:
        - totalSessions
        - completedSessions
        - averageRating
        - totalBiasIdentified
        - totalFallaciesIdentified
        - totalOppositionGenerated
        - totalItemsAccepted
        - dataPoints
